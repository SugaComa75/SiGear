name: Policy Service Tests

on:
  push:
    paths:
      - 'packages/backend/services/policy-service/**'
  pull_request:
    paths:
      - 'packages/backend/services/policy-service/**'

jobs:
  test:
    name: Run backend policy-service tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install repo dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in `seq 1 20`; do
            pg_isready -h localhost -U postgres && break || sleep 1
          done

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply DB schema and migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d postgres -f infrastructure/database/schema.sql
          psql -h localhost -U postgres -d postgres -f infrastructure/database/migrations/0004_add_unknown_axes.sql || true
          psql -h localhost -U postgres -d postgres -f infrastructure/database/migrations/0005_add_reason_codes.sql || true

      - name: Set POLICY_DATABASE_URL for tests
        run: echo "POLICY_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> $GITHUB_ENV

      - name: Run policy-service tests
        working-directory: packages/backend/services/policy-service
        env:
          POLICY_DATABASE_URL: ${{ env.POLICY_DATABASE_URL }}
        run: npm test
