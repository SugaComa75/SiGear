name: Sync approved files from private Gitea

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: gitea-public-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone private Gitea source
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITEA_TOKEN"
          git -c "http.extraHeader=Authorization: token $GITEA_TOKEN" clone \
            --depth 1 --branch "Local-PC" \
            "https://git.sprint-family.co.uk/Sprint-Family-Tech/SiGear.git" \
            "$RUNNER_TEMP/private-source"
      - name: Copy only approved public files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-files"
          while IFS= read -r path || [ -n "$path" ]; do
            case "$path" in ""|\#*) continue ;; esac
            if [ ! -e "$RUNNER_TEMP/private-source/$path" ]; then
              echo "Approved path is missing from Gitea: $path" >&2
              exit 1
            fi
            rsync -aR "$RUNNER_TEMP/private-source/./$path" "$RUNNER_TEMP/public-files/"
          done < ".github/sync-include.txt"
          rsync -a --delete --exclude ".git/" --exclude ".github/" \
            "$RUNNER_TEMP/public-files/" "$GITHUB_WORKSPACE/"
      - name: Commit synchronized files
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Public files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync approved files from Gitea"
          git push
