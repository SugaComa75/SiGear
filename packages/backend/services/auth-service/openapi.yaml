openapi: 3.0.3
info:
  title: SiGear Auth Service API
  version: 0.1.0
paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Tokens and user info
  /auth/token/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens
  /auth/token/verify:
    post:
      summary: Verify access token and return NTI claims
      responses:
        '200':
          description: Token verification details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      subject:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      ntiIdentityId:
                        type: string
                      ntiAssuranceLevel:
                        type: string
                        enum: [base, verified]
                      permissions:
                        type: array
                        items:
                          type: string
                      tokenType:
                        type: string
